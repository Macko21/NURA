services:
  - type: web
    name: los10000-macko
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.18.0
      - key: PAYMENTS_ENABLED
        value: 'false'
      - key: PAID_COMPETITION_ENABLED
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CEO_SECRET
        sync: false
