<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Los 10.000 de Macko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c14">
</head>
<body>

<!-- ══ LOBBY ══ -->
<div id="screen-lobby" class="screen active">
  <canvas id="bg-canvas" class="bg-canvas"></canvas>
  <div class="lobby-content">
    <div class="logo-block">
      <div class="logo-dice-wrap">
        <div class="logo-die">🎲</div>
      </div>
      <h1 class="logo-title">Los 10.000<br><em>de Macko</em></h1>
      <p class="logo-sub">Juego de dados · 2 a 10 jugadores</p>
    </div>
    <div class="lobby-form">
      <div class="field">
        <label>Tu nombre</label>
        <input id="input-name" type="text" placeholder="Ej: Macko" maxlength="20" autocomplete="off">
      </div>
      <div class="row-2">
        <button class="btn btn-gold" id="btn-create">+ Crear sala</button>
        <button class="btn btn-ghost" id="btn-join-open">→ Unirse</button>
      </div>
      <button class="btn btn-link" id="btn-ranking">🏆 Ranking global</button>
    </div>
  </div>
</div>

<!-- ══ UNIRSE ══ -->
<div id="screen-join" class="screen">
  <div class="top-bar">
    <button class="back-btn" id="btn-back-join">‹ Volver</button>
    <h2>Ingresar a sala</h2>
    <span></span>
  </div>
  <div class="page-body">
    <div class="field">
      <label>Código de sala</label>
      <input id="input-code" class="code-input" type="text" placeholder="A7X92K" maxlength="6" autocomplete="off">
    </div>
    <button class="btn btn-gold" id="btn-join-confirm">Entrar →</button>
  </div>
</div>

<!-- ══ SALA ESPERA ══ -->
<div id="screen-room" class="screen">
  <div class="top-bar">
    <h2>Sala de espera</h2>
    <div class="code-row">
      <span class="code-badge" id="room-code-display"></span>
      <button class="btn-icon-sm" id="btn-copy-code" title="Copiar">📋</button>
    </div>
  </div>
  <div class="page-body">
    <p class="hint">Compartí el código · la partida arranca cuando todos estén listos</p>
    <div id="players-list" class="players-list"></div>
    <button class="btn btn-gold" id="btn-ready">Estoy listo ✓</button>
    <button class="btn btn-ghost" id="btn-leave-room">← Salir de la sala</button>
    <button class="btn btn-danger hidden" id="btn-cancel-room">✕ Cancelar sala</button>
  </div>
</div>

<!-- ══ JUEGO ══ -->
<div id="screen-game" class="screen">
  <div id="scoreboard" class="scoreboard"></div>

  <div class="game-table">

    <!-- Banner turno + timer -->
    <div class="turn-header">
      <div id="turn-banner" class="turn-banner"></div>
      <div id="turn-timer" class="turn-timer hidden">
        <svg class="timer-ring" viewBox="0 0 44 44">
          <circle class="timer-ring-bg" cx="22" cy="22" r="18"/>
          <circle id="timer-ring-bar" class="timer-ring-bar" cx="22" cy="22" r="18"/>
        </svg>
        <span id="timer-secs" class="timer-secs">30</span>
      </div>
    </div>

    <!-- Área de dados -->
    <div class="dice-zone">
      <div id="dice-tray" class="dice-tray">
        <div id="dice-row" class="dice-row"></div>
      </div>
      <div id="roll-msg" class="roll-msg"></div>
    </div>

    <!-- Stats del turno -->
    <div class="stats-row">
      <div class="stat-box">
        <span class="stat-label">Turno</span>
        <span id="turn-points" class="stat-val gold">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Intentos</span>
        <span id="roll-count" class="stat-val">— / 3</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">Mi score</span>
        <span id="my-score" class="stat-val">0</span>
      </div>
    </div>

    <!-- Botones -->
    <div id="action-zone" class="action-zone hidden">
      <button id="btn-roll" class="btn-roll">
        <span class="btn-roll-icon">🎲</span>
        <span id="roll-label">Tirar</span>
      </button>
      <button id="btn-bank" class="btn-bank" disabled>
        <span>✔ Plantarse</span>
        <span id="bank-pts" class="bank-pts"></span>
      </button>
    </div>
    <div id="waiting-zone" class="waiting-zone">
      <div class="dot-loader"><span></span><span></span><span></span></div>
      <span id="waiting-text">Esperando...</span>
    </div>
  </div>

  <!-- Chat -->
  <div id="chat-fab" class="chat-fab">
    <button id="chat-toggle" class="chat-toggle-btn">💬<span id="chat-badge" class="chat-badge hidden"></span></button>
    <div id="chat-panel" class="chat-panel hidden">
      <div class="chat-hdr"><span>Chat</span><button id="chat-close">✕</button></div>
      <div id="chat-msgs" class="chat-msgs"></div>
      <div class="chat-foot">
        <input id="chat-input" type="text" placeholder="Molestá..." maxlength="200">
        <button id="chat-send">↑</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ RANKING ══ -->
<div id="screen-ranking" class="screen">
  <div class="top-bar">
    <button class="back-btn" id="btn-back-ranking">‹ Volver</button>
    <h2>🏆 Ranking Global</h2>
    <span></span>
  </div>
  <div class="page-body">
    <div id="ranking-list" class="ranking-list"></div>
  </div>
</div>

<!-- ══ MODAL VICTORIA ══ -->
<div id="modal-win" class="modal hidden">
  <div class="modal-box">
    <div class="confetti-area" id="confetti-area"></div>
    <div class="win-trophy">🏆</div>
    <h2 id="win-name" class="win-name"></h2>
    <p id="win-desc" class="win-desc"></p>
    <div id="win-dice" class="win-dice-row"></div>
    <button class="btn btn-gold" id="btn-new-game">Volver al lobby</button>
  </div>
</div>

<!-- ══ TOAST ══ -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
