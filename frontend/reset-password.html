<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Los 10.000 de Macko</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-bg">
    <div class="auth-box">
        <div class="auth-logo">🔐</div>
        <h1 class="auth-title">Nueva Clave</h1>
        <p class="auth-sub">Ingresá tu nueva contraseña</p>
        <div class="glass-panel" style="margin-top:8px;display:flex;flex-direction:column;gap:12px">
            <input id="new-pass" type="password" placeholder="Tu nueva contraseña (mín. 10 caracteres)" class="glass-input" minlength="10" maxlength="128" autocomplete="new-password">
            <button id="btn-reset" class="btn btn-gold">Actualizar acceso</button>
        </div>
        <p class="auth-sub" style="margin-top:12px">
            <a href="/" style="color:var(--gold);text-decoration:none">← Volver al inicio</a>
        </p>
    </div>
    <div id="toast" class="toast hidden"></div>

    <script>
    const btn = document.getElementById('btn-reset');
    let toastT;

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastT);
      toastT = setTimeout(() => el.classList.add('hidden'), 4000);
    }

    function showSuccess() {
        const panel = document.querySelector('.glass-panel');
        panel.innerHTML = `
            <div style="text-align:center; padding:20px;">
                <div style="font-size:50px;">✅</div>
                <h2 style="font-family:'Cinzel',serif; margin:10px 0; color:var(--gold);">¡Éxito!</h2>
                <p style="color:var(--text2)">Tu contraseña ha sido actualizada.</p>
                <p style="font-size:11px;color:var(--text3);margin-top:8px">Redirigiendo al inicio...</p>
            </div>
        `;
        setTimeout(() => {
            window.location.href = '/';
        }, 2500);
    }

    btn.onclick = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const newPassword = document.getElementById('new-pass').value;

        if (!token) {
            showToast('El enlace de recuperación es inválido');
            return;
        }
        if (!newPassword || newPassword.length < 10 || newPassword.length > 128) {
            showToast('La contraseña debe tener entre 10 y 128 caracteres');
            return;
        }

        btn.textContent = "Actualizando...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword })
            });

            const data = await res.json();

            if (res.ok) {
                showSuccess();
            } else {
                showToast('Error: ' + (data.error || 'Token inválido o expirado'));
                btn.textContent = "Actualizar contraseña";
                btn.disabled = false;
            }
        } catch (e) {
            showToast('Error de conexión');
            btn.textContent = "Actualizar contraseña";
            btn.disabled = false;
        }
    };

    document.getElementById('new-pass').addEventListener('keydown', e => {
        if (e.key === 'Enter') btn.click();
    });
    </script>
</body>
</html>
