<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NURA" />
  <title>NURA — Gestión</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="icon" href="/logo.png" type="image/png" />
  <script>
    (() => {
      let preference;
      try { preference = localStorage.getItem('nura.theme'); } catch {}
      document.documentElement.dataset.theme = preference === 'dark' ||
        (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="/src/appearance.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- SPLASH -->
  <div id="splash" style="position:fixed;inset:0;background:#0c1220;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s;">
    <img data-brand-image src="/logo.png" style="width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 0 20px rgba(169,140,236,0.5));animation:splashPulse 1.5s ease-in-out infinite alternate;" />
    <div data-brand-name class="logo-brand splash-wordmark">Nur<span class="letra-a">a</span></div>
    <div data-brand-subtitle style="font-size:8px;color:rgba(255,255,255,0.25);letter-spacing:2.5px;text-transform:uppercase;margin-top:4px;">artículos de limpieza</div>
    <div style="margin-top:24px;width:40px;height:2.5px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;">
      <div style="height:100%;background:linear-gradient(90deg,#a98cec,#a78bfa);animation:splashLoad 1.2s ease-in-out infinite;border-radius:2px;"></div>
    </div>
  </div>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" style="display:none;">
    <div class="login-box">
      <button type="button" class="btn icon-action theme-toggle login-theme" data-theme-toggle title="Cambiar tema" aria-label="Cambiar tema"></button>
      <img data-brand-image src="/logo.png" alt="" class="logo-img" />
      <h2 data-brand-name class="logo-brand">Nur<span class="letra-a">a</span></h2>
      <div data-brand-subtitle class="sub">artículos de limpieza</div>
      <input type="text" id="loginUser" placeholder="Usuario o email" autocomplete="username" />
      <input type="password" id="loginPass" placeholder="Contraseña" autocomplete="current-password" />
      <button id="loginBtn">Ingresar</button>
    </div>
  </div>

  <!-- SYNC BAR -->
  <div id="syncBar" style="display:none;position:fixed;top:0;left:0;right:0;height:2.5px;background:var(--sync-bar-background,linear-gradient(90deg,#7351c4,#a78bfa));z-index:8000;animation:syncP .9s ease-in-out infinite alternate;pointer-events:none;"></div>

  <!-- APP -->
  <div id="app" style="display:none;">
    <nav class="sidebar" id="sidebar" aria-label="Menú principal">
      <button type="button" id="sidebarClose" aria-label="Cerrar menú">✕</button>
      <div class="sidebar-logo">
        <img data-brand-image src="/logo.png" alt="" class="logo-img" />
        <div class="logo-text">
          <span data-brand-name class="logo-brand">Nur<span class="letra-a">a</span></span>
          <span data-brand-subtitle class="logo-sub">artículos de limpieza</span>
        </div>
      </div>
      <ul class="nav-menu" id="navMenu"></ul>
      <div class="sidebar-footer">
        <div id="syncStatus" style="display:flex;align-items:center;gap:6px;padding:6px 12px;margin-bottom:6px;font-size:10px;color:rgba(255,255,255,0.3);">
          <span id="syncDot" style="width:5px;height:5px;border-radius:50%;background:#a98cec;flex-shrink:0;transition:background .3s;"></span>
          <span id="syncTxt">Conectando...</span>
        </div>
        <button type="button" class="sidebar-version" id="versionNura" title="Notas de versión" aria-label="Notas de versión"></button>
      </div>
    </nav>

    <main class="main-content">
      <header class="topbar">
        <button type="button" class="hamburger" id="hamburger" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">☰</button>
        <div class="topbar-title" id="pageTitle">Inicio</div>
        <div class="topbar-actions" id="topbarActions"></div>
        <button type="button" class="btn icon-action is-teal" id="btnWhatsappGlobal" title="Enviar catálogo por WhatsApp" aria-label="Enviar catálogo por WhatsApp"></button>
        <button type="button" class="btn icon-action theme-toggle" data-theme-toggle title="Cambiar tema" aria-label="Cambiar tema"></button>
        <button type="button" id="logoutBtn" class="btn icon-action is-danger" aria-label="Cerrar sesión" title="Cerrar sesión">Salir</button>
      </header>
      <div class="page active" id="page-dashboard"></div>
      <div class="page" id="page-catalogo"></div>
      <div class="page" id="page-clientes"></div>
      <div class="page" id="page-ventas"></div>
      <div class="page" id="page-compras"></div>
      <div class="page" id="page-stock"></div>
      <div class="page" id="page-combos"></div>
      <div class="page" id="page-deudas"></div>
      <div class="page" id="page-reportes"></div>
      <div class="page" id="page-usuarios"></div>
      <div class="page" id="page-ajustes"></div>
      <div class="page" id="page-misreportes"></div>
    </main>

    <!-- BOTTOM NAV (Mobile) -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Accesos rápidos">
      <div class="bottom-nav-inner" id="bottomNavInner"></div>
    </nav>

    <!-- FAB (Mobile) -->
    <button class="fab" id="fab" aria-label="Nueva venta" title="Nueva venta · Arrastrá para mover o usá Alt + flechas">+</button>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
